name: Supabase Keep-Alive

# Mutating ping every 2 days. We PATCH release_state.updated_at so the
# project sees a real write (not just a PostgREST-pooled SELECT) — Supabase's
# inactivity scan flagged us in 2026-05-13 despite three successful read pings,
# suggesting reads from the PostgREST connection pool may not register as
# database activity. UPDATE forces a write transaction.
on:
  schedule:
    - cron: '0 8 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch release_state (write) and verify (read)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          now=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "=== 1) PATCH release_state.updated_at = $now"
          patch_response=$(curl -fsS -w "\n%{http_code}" -X PATCH \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            --data "{\"updated_at\":\"$now\"}" \
            "$SUPABASE_URL/rest/v1/release_state?id=eq.1")
          patch_status=$(echo "$patch_response" | tail -n1)
          patch_body=$(echo "$patch_response" | sed '$d')
          echo "PATCH status: $patch_status"
          echo "PATCH body:   $patch_body"
          if [ "$patch_status" != "200" ]; then
            echo "Keep-alive PATCH failed with status $patch_status"
            exit 1
          fi

          echo "=== 2) GET users (sanity check that the project is live)"
          get_response=$(curl -fsS -w "\n%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/users?select=id&limit=1")
          get_status=$(echo "$get_response" | tail -n1)
          get_body=$(echo "$get_response" | sed '$d')
          echo "GET status: $get_status"
          echo "GET body:   $get_body"
          if [ "$get_status" != "200" ]; then
            echo "Keep-alive GET failed with status $get_status"
            exit 1
          fi
