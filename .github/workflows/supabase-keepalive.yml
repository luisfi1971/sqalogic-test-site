name: Supabase Keep-Alive

# Keeps the free-tier project out of the inactivity sweep. Two layers, in order
# of how much the sweep appears to care:
#   1) Direct SQL through the Management API  -> real DB transaction, off the
#      Data API channel. This is the layer we believe actually counts.
#   2) PATCH release_state via PostgREST      -> kept as a canary/safety net.
# History: reads over PostgREST did not stop the 2026-05-06 pause; writes over
# PostgREST still drew "scheduled to be paused" warnings on 2026-05-13 and
# 2026-05-27. Since 2026-05-27 the Management API write (from a local Windows
# Scheduled Task) held the project open -- until that laptop slept through three
# runs and a ~7-day gap drew a fresh warning on 2026-09-21. Hence layer 1 here.
on:
  schedule:
    - cron: '0 8 */2 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep-alive via Management API (direct SQL write)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"query":"update public.release_state set updated_at = now() where id = 1 returning id, updated_at;"}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "SQL status: $status"
          echo "SQL body:   $body"
          if [ "$status" != "201" ] && [ "$status" != "200" ]; then
            echo "Management API keep-alive failed with status $status"
            exit 1
          fi

      - name: Touch release_state (write) and verify (read)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          now=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "=== 1) PATCH release_state.updated_at = $now"
          patch_response=$(curl -fsS -w "\n%{http_code}" -X PATCH \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            --data "{\"updated_at\":\"$now\"}" \
            "$SUPABASE_URL/rest/v1/release_state?id=eq.1")
          patch_status=$(echo "$patch_response" | tail -n1)
          patch_body=$(echo "$patch_response" | sed '$d')
          echo "PATCH status: $patch_status"
          echo "PATCH body:   $patch_body"
          if [ "$patch_status" != "200" ]; then
            echo "Keep-alive PATCH failed with status $patch_status"
            exit 1
          fi

          echo "=== 2) GET users (sanity check that the project is live)"
          get_response=$(curl -fsS -w "\n%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/users?select=id&limit=1")
          get_status=$(echo "$get_response" | tail -n1)
          get_body=$(echo "$get_response" | sed '$d')
          echo "GET status: $get_status"
          echo "GET body:   $get_body"
          if [ "$get_status" != "200" ]; then
            echo "Keep-alive GET failed with status $get_status"
            exit 1
          fi

      # GitHub disables scheduled workflows after 60 days without repository
      # activity (commits), regardless of successful runs — warning email
      # received 2026-07-07. Re-enabling the workflow via API on every run
      # resets that timer.
      - name: Reset 60-day scheduled-workflow disable timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
